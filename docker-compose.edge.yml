# Подключается, только если на сервере свободны порты 80/443.
services:
  web:
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./web:/srv:ro
      - ./deploy/Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports: !override
      - "80:80"
      - "443:443"
      - "443:443/udp"
volumes:
  caddy_data:
  caddy_config:
