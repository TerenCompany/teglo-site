name: teglo
services:
  web:
    image: caddy:2-alpine
    container_name: teglo-web
    restart: unless-stopped
    volumes:
      - ./web:/srv:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${WEB_BIND:-127.0.0.1:8088}:80"
  bot:
    build: ./bot
    container_name: teglo-bot
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
